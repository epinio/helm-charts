{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epinio-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/component: application
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: epinio

---
# Cluster-scoped reads for capability probes + adoption discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-epinio-mcp" .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["application.epinio.io"]
    resources: ["apps", "services", "appcharts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-epinio-mcp" .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-epinio-mcp" .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: epinio-mcp
    namespace: {{ .Release.Namespace }}

---
# Namespace-scoped writes for self-reconciliation + self-adoption.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epinio-mcp-self
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["application.epinio.io"]
    resources: ["apps"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epinio-mcp-self
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epinio-mcp-self
subjects:
  - kind: ServiceAccount
    name: epinio-mcp
    namespace: {{ .Release.Namespace }}

{{- if and .Values.mcp.elevated .Values.mcp.broadRBAC }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-epinio-mcp-adoption" .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["application.epinio.io"]
    resources: ["apps"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-epinio-mcp-adoption" .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-epinio-mcp-adoption" .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: epinio-mcp
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
