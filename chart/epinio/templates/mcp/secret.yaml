{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: epinio-mcp-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ default "admin" .Values.mcp.auth.username | quote }}
  password: {{ include "epinio-mcp-password" . | quote }}
{{- end }}
