{{- if .Values.mcp.enabled }}
{{- $mcpImage := .Values.image.mcp -}}
{{- $mcpImageRef := printf "%s%s:%s" (default $mcpImage.registry (include "registry-url" .)) $mcpImage.repository $mcpImage.tag -}}
{{- $cliVersion := .Values.mcp.cliVersion | default .Values.image.epinio.tag -}}
{{- $serverURL := default (printf "http://epinio-server.%s.svc.cluster.local" .Release.Namespace) .Values.mcp.serverURL -}}
{{- /* MCP runs in-cluster; TLS terminates at Ingress — same default as epinio-ui / old mcp Deployment. */ -}}
{{- $appAPIURL := default $serverURL .Values.mcp.apiURL -}}
{{- $appNS := default "mcp" .Values.mcp.namespace -}}
{{- $appName := default "epinio-mcp" .Values.mcp.appName -}}
---
# Post-install Job: push MCP as a normal Epinio application (container image),
# matching the flow in https://github.com/epinio/mcp (`epinio push`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: epinio-mcp-install
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp-install
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  install.sh: |
    #!/bin/sh
    set -eu

    echo "Installing curl ..."
    apk add --no-cache curl ca-certificates >/dev/null

    echo "Waiting for Epinio API at ${EPINIO_SERVER_URL} ..."
    i=0
    until curl -sf "${EPINIO_SERVER_URL}/ready" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 60 ]; then
        echo "ERROR: Epinio API not ready after waiting"
        curl -sv "${EPINIO_SERVER_URL}/ready" || true
        exit 1
      fi
      echo "  waiting (${i}/60) ..."
      sleep 5
    done
    echo "Epinio API is ready."

    echo "Downloading epinio CLI ${EPINIO_CLI_VERSION} ..."
    curl -fsSL -o /tmp/epinio \
      "https://github.com/epinio/epinio/releases/download/${EPINIO_CLI_VERSION}/epinio-linux-x86_64"
    chmod +x /tmp/epinio
    /tmp/epinio version

    echo "Writing Epinio CLI settings (skip login CA check) ..."
    # epinio login always dials TLS :443 to check the CA, even for http:// URLs.
    # Write settings.yaml directly for the in-cluster HTTP Service.
    mkdir -p /tmp/epinio-config
    PASS_B64=$(printf '%s' "${EPINIO_PASSWORD}" | base64 | tr -d '\n')
    WSS_URL=$(printf '%s' "${EPINIO_SERVER_URL}" | sed 's|^http://|ws://|;s|^https://|wss://|')
    printf 'api: %s\nwss: %s\nuser: %s\npass: %s\nnamespace: workspace\ncerts: ""\ncolors: false\n' \
      "${EPINIO_SERVER_URL}" "${WSS_URL}" "${EPINIO_USERNAME}" "${PASS_B64}" \
      > /tmp/epinio-config/settings.yaml
    export EPINIO_SETTINGS=/tmp/epinio-config/settings.yaml

    echo "Checking API access ..."
    /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" namespace list >/dev/null

    echo "Ensuring namespace ${MCP_NAMESPACE} ..."
    /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" namespace show "${MCP_NAMESPACE}" >/dev/null 2>&1 \
      || /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" namespace create "${MCP_NAMESPACE}"
    /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" target "${MCP_NAMESPACE}"

    echo "Pushing ${MCP_APP_NAME} from ${MCP_IMAGE} ..."
    /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" push \
      --name "${MCP_APP_NAME}" \
      --container-image-url "${MCP_IMAGE}" \
      --app-chart standard \
      --env "EPINIO_API_URL=${MCP_EPINIO_API_URL}" \
      --env "EPINIO_USERNAME=${EPINIO_USERNAME}" \
      --env "EPINIO_PASSWORD=${EPINIO_PASSWORD}"

    echo "MCP app install complete."
    /tmp/epinio --skip-ssl-verification --settings-file "${EPINIO_SETTINGS}" app show "${MCP_APP_NAME}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: epinio-mcp-install
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: epinio-mcp-install
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "21"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epinio-mcp-install
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: install
          image: {{ .Values.mcp.job.image | default "alpine:3.20" | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/install.sh"]
          env:
            - name: EPINIO_SERVER_URL
              value: {{ $serverURL | quote }}
            - name: EPINIO_CLI_VERSION
              value: {{ $cliVersion | quote }}
            - name: EPINIO_USERNAME
              value: {{ default "admin" .Values.mcp.auth.username | quote }}
            - name: EPINIO_PASSWORD
              value: {{ include "epinio-mcp-password" . | quote }}
            - name: MCP_NAMESPACE
              value: {{ $appNS | quote }}
            - name: MCP_APP_NAME
              value: {{ $appName | quote }}
            - name: MCP_IMAGE
              value: {{ $mcpImageRef | quote }}
            - name: MCP_EPINIO_API_URL
              value: {{ $appAPIURL | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: epinio-mcp-install
            defaultMode: 0755
{{- end }}
