{{- if .Values.mcp.enabled }}
{{- $mcpImage := .Values.image.mcp -}}
{{- $mcpImageRef := printf "%s%s:%s" (default $mcpImage.registry (include "registry-url" .)) $mcpImage.repository $mcpImage.tag -}}
{{- $epinioImage := .Values.image.epinio -}}
{{- $epinioImageRef := printf "%s%s:%s" (default $epinioImage.registry (include "registry-url" .)) $epinioImage.repository (default .Chart.AppVersion $epinioImage.tag) -}}
{{- $svcPort := .Values.service.port | default 80 -}}
{{- $serverURL := default (printf "http://epinio-server.%s.svc.cluster.local:%v" .Release.Namespace $svcPort) .Values.mcp.serverURL -}}
{{- $appAPIURL := default $serverURL .Values.mcp.apiURL -}}
{{- $wssURL := $serverURL | replace "https://" "wss://" | replace "http://" "ws://" -}}
{{- $appNS := default "mcp" .Values.mcp.namespace -}}
{{- $appName := default "epinio-mcp" .Values.mcp.appName -}}
{{- $username := default "admin" .Values.mcp.auth.username -}}
{{- $password := include "epinio-mcp-password" . -}}
{{- $nsObj := lookup "v1" "Namespace" "" $appNS -}}
{{- $nsExists := and $nsObj (eq (index ($nsObj.metadata.labels | default dict) "app.kubernetes.io/component") "epinio-namespace") -}}
---
# Credentials for the MCP install/cleanup Jobs and app env.
apiVersion: v1
kind: Secret
metadata:
  name: epinio-mcp-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epinio.labels" . | nindent 4 }}
    app.kubernetes.io/name: epinio-mcp-install
type: Opaque
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  # CLI Settings.Password is always base64-decoded (EPINIO_PASS).
  pass-b64: {{ $password | b64enc | quote }}
  # Pre-rendered settings file. The CLI refuses every API call unless
  # Settings.Location is non-empty, and that field is only set when the
  # settings file exists on disk at startup (internal/cli/settings.LoadFrom) —
  # `epinio login` would normally create it, but login always TLS-dials the
  # server to check its CA, even for http:// addresses, so it can't be used
  # against the in-cluster HTTP Service. Mounting this file sidesteps both.
  settings.yaml: |
    api: {{ $serverURL | quote }}
    wss: {{ $wssURL | quote }}
    user: {{ $username | quote }}
    pass: {{ $password | b64enc | quote }}
    namespace: {{ $appNS | quote }}
    certs: ""
    colors: false
  # Push manifest. Keeping credentials here (instead of `epinio push --env
  # EPINIO_PASSWORD=...` CLI flags) keeps them out of the Job's pod spec —
  # `kubectl get pod -o yaml` / `describe pod` would otherwise show the
  # plaintext password in spec.containers[].command.
  push.yaml: |
    name: {{ $appName | quote }}
    namespace: {{ $appNS | quote }}
    configuration:
      appchart: standard
      environment:
        EPINIO_API_URL: {{ $appAPIURL | quote }}
        EPINIO_USERNAME: {{ $username | quote }}
        EPINIO_PASSWORD: {{ $password | quote }}
    origin:
      container: {{ $mcpImageRef | quote }}
---
# Post-install Job: push MCP as a normal Epinio app using the chart's own
# epinio-server image as the CLI (multi-arch, registry-url, no runtime download).
apiVersion: batch/v1
kind: Job
metadata:
  name: epinio-mcp-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epinio.labels" . | nindent 4 }}
    app.kubernetes.io/name: epinio-mcp-install
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "21"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # A couple of retries absorb a common transient: this hook can fire before
  # epinio-server's Service is actually reachable. activeDeadlineSeconds below
  # still bounds the total time regardless of how many attempts run.
  backoffLimit: {{ .Values.mcp.job.backoffLimit | default 2 }}
  activeDeadlineSeconds: {{ .Values.mcp.job.activeDeadlineSeconds | default 300 }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "epinio.labels" . | nindent 8 }}
        app.kubernetes.io/name: epinio-mcp-install
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.mcp.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.job.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.job.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $nsExists }}
      initContainers:
        - name: ensure-namespace
          image: {{ $epinioImageRef | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /epinio
            - --skip-ssl-verification
            - --no-colors
            - namespace
            - create
            - {{ $appNS | quote }}
          env:
            - name: HOME
              value: /tmp
            - name: EPINIO_SETTINGS
              value: /settings/settings.yaml
            - name: EPINIO_API
              value: {{ $serverURL | quote }}
            - name: EPINIO_WSS
              value: {{ $wssURL | quote }}
            - name: EPINIO_NAMESPACE
              value: {{ $appNS | quote }}
            - name: EPINIO_SKIP_SSL_VERIFICATION
              value: "true"
            - name: EPINIO_USER
              valueFrom:
                secretKeyRef:
                  name: epinio-mcp-install
                  key: username
            - name: EPINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: epinio-mcp-install
                  key: pass-b64
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /.config
            - name: settings
              mountPath: /settings
              readOnly: true
      {{- end }}
      containers:
        - name: push
          image: {{ $epinioImageRef | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /epinio
            - --skip-ssl-verification
            - --no-colors
            - push
            - /settings/push.yaml
          env:
            - name: HOME
              value: /tmp
            - name: EPINIO_SETTINGS
              value: /settings/settings.yaml
            - name: EPINIO_API
              value: {{ $serverURL | quote }}
            - name: EPINIO_WSS
              value: {{ $wssURL | quote }}
            - name: EPINIO_NAMESPACE
              value: {{ $appNS | quote }}
            - name: EPINIO_SKIP_SSL_VERIFICATION
              value: "true"
            - name: EPINIO_USER
              valueFrom:
                secretKeyRef:
                  name: epinio-mcp-install
                  key: username
            - name: EPINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: epinio-mcp-install
                  key: pass-b64
          {{- with .Values.mcp.job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /.config
            - name: settings
              mountPath: /settings
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: settings
          secret:
            secretName: epinio-mcp-install
            items:
              - key: settings.yaml
                path: settings.yaml
              - key: push.yaml
                path: push.yaml
{{- end }}
