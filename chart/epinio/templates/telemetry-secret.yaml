{{- if .Values.telemetry.enabled }}
{{- /*
  Trigger-token Secret: authorizes a call to POST /api/v1/telemetry/publish.
  Generated once and preserved across `helm upgrade` (lookup), same technique
  used for the SeaweedFS credentials in s3-secret.yaml, so the CronJob and
  epinio-server always agree on the token without a manual step.
*/ -}}
{{- /*
  `ternary` evaluates both branches eagerly (it is a plain function call, not
  a short-circuiting if), so building the "reuse" branch as one of its
  arguments would call `index` on a nil map on a fresh install and crash.
  Guard with an explicit if instead, same as instance-configmap.yaml does.
*/ -}}
{{- $triggerSecretName := "epinio-telemetry-trigger" -}}
{{- $existingTrigger := lookup "v1" "Secret" .Release.Namespace $triggerSecretName -}}
{{- $triggerToken := "" -}}
{{- if and $existingTrigger $existingTrigger.data }}
  {{- $existingToken := index $existingTrigger.data "token" -}}
  {{- if $existingToken }}
    {{- $triggerToken = b64dec $existingToken -}}
  {{- end }}
{{- end }}
{{- if not $triggerToken }}
  {{- $triggerToken = randAlphaNum 40 -}}
{{- end }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $triggerSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epinio.labels" . | nindent 4 }}
stringData:
  token: {{ $triggerToken | quote }}

{{- /*
  Grafana Cloud access-policy token. Only rendered as a chart-managed Secret
  when the user hasn't pointed telemetry.grafanaCloud.existingSecret at one
  of their own - the BYO-secret path already used by s3.certificateSecret /
  seaweedfs.existingSecret elsewhere in this chart, and the recommended one
  for this token specifically since it is a real external credential.
*/ -}}
{{- if and (not .Values.telemetry.grafanaCloud.existingSecret) .Values.telemetry.grafanaCloud.token }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: epinio-telemetry-grafana-cloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epinio.labels" . | nindent 4 }}
stringData:
  token: {{ .Values.telemetry.grafanaCloud.token | quote }}
{{- end }}
{{- end }}
