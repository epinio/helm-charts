## Grafana Cloud observability — chart defaults (collectors + telemetry services).
##
## User config (URLs, token, cluster name): epinio-helper/
##   observability-config.yaml + observability-secrets.yaml
## Install: epinio-helper/install-grafana-cloud-observability.sh

grafanaCloud:
  token: &grafanaCloudToken ""

k8s-monitoring:
  cluster:
    name: ""

  collectorCommon:
    alloy:
      remoteConfig:
        enabled: false
        url: ""
        auth:
          type: basic
          username: ""
          password: *grafanaCloudToken

  collectors:
    alloy-daemonset:
      presets:
        - xlarge
        - root
        - host-network
        - host-storage
        - host-cgroup
        - clustered
        - service-discovery
        - filesystem-log-reader
        - daemonset
      controller:
        autoscaling:
          vertical:
            enabled: true
            resourcePolicy:
              containerPolicies:
                - containerName: alloy
                  controlledResources: [cpu, memory]
                  controlledValues: RequestsAndLimits
                  maxAllowed:
                    cpu: 4
                    memory: 8Gi
                  minAllowed:
                    cpu: 1
                    memory: 2Gi

    alloy-deployment:
      presets:
        - xlarge
        - clustered
        - deployment
        - otel-receiver
      extraService:
        enabled: true
        name: otel-receiver
      controller:
        autoscaling:
          horizontal:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 75
            targetMemoryUtilizationPercentage: 80

  destinations: {}

  podLogsViaLoki:
    enabled: false
    collector: alloy-daemonset

  clusterMetrics:
    enabled: false
    collector: alloy-deployment

  clusterEvents:
    enabled: false
    collector: alloy-daemonset

  annotationAutodiscovery:
    enabled: false
    collector: alloy-daemonset

  telemetryServices:
    node-exporter:
      deploy: true
    kube-state-metrics:
      deploy: true
    beyla:
      deploy: true
      k8sCache:
        replicas: 1
    opencost:
      deploy: true
      metricsSource: custom
    kepler:
      deploy: true
    k8s-manifest-tail:
      deploy: true
      config:
        objects:
          - { apiVersion: v1, kind: Pod }
          - { apiVersion: apps/v1, kind: Deployment }
          - { apiVersion: apps/v1, kind: StatefulSet }
          - { apiVersion: apps/v1, kind: DaemonSet }
    sdkInjector:
      deploy: true
