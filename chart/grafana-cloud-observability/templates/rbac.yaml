apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grafana-cloud-observability.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana-cloud-observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "grafana-cloud-observability.fullname" . }}
  labels:
    {{- include "grafana-cloud-observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods, pods/log, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grafana-cloud-observability.fullname" . }}
  labels:
    {{- include "grafana-cloud-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "grafana-cloud-observability.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grafana-cloud-observability.fullname" . }}
    namespace: {{ .Release.Namespace }}
