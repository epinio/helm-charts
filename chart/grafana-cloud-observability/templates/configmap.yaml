apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana-cloud-observability.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana-cloud-observability.labels" . | nindent 4 }}
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = {{ .Values.grafanaCloud.prometheusUrl | quote }}
        basic_auth {
          username = {{ include "grafana-cloud-observability.plainString" .Values.grafanaCloud.prometheusUsername | quote }}
          password = sys.env("GRAFANA_CLOUD_TOKEN")
        }
      }
    }

    prometheus.relabel "add_cluster" {
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      rule {
        target_label = "cluster"
        replacement  = {{ .Values.clusterName | quote }}
      }
    }

    // ---- Logs → Grafana Cloud Loki ----
    {{- if .Values.podLogs }}
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app_kubernetes_io_name"
      }
      rule {
        target_label = "cluster"
        replacement  = {{ .Values.clusterName | quote }}
      }
    }

    // API stream (works for long-lived pods; short Jobs may miss early lines)
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.grafana_cloud.receiver]
    }

    loki.write "grafana_cloud" {
      endpoint {
        url = {{ .Values.grafanaCloud.lokiUrl | quote }}
        basic_auth {
          username = {{ include "grafana-cloud-observability.plainString" .Values.grafanaCloud.lokiUsername | quote }}
          password = sys.env("GRAFANA_CLOUD_TOKEN")
        }
      }
    }
    {{- end }}

    // ---- Metrics → Grafana Cloud Prometheus ----
    {{- if .Values.clusterMetrics }}
    // kube-state-metrics (Running Apps / kube_pod_* dashboards)
    prometheus.scrape "kube_state_metrics" {
      targets = [{
        __address__ = {{ printf "%s-kube-state-metrics:8080" (include "grafana-cloud-observability.fullname" .) | quote }},
      }]
      forward_to = [prometheus.relabel.add_cluster.receiver]
    }

    // Pods with prometheus.io scrape annotations (epinio-server when enabled)
    discovery.kubernetes "annotated_pods" {
      role = "pod"
    }

    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.annotated_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        target_label  = "__address__"
        regex         = "(.+?)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "annotated_pods" {
      targets    = discovery.relabel.annotated_pods.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
    }

    // cAdvisor / node metrics via kubelet
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "cluster"
        replacement  = {{ .Values.clusterName | quote }}
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
      metrics_path = "/metrics/cadvisor"
      forward_to   = [prometheus.remote_write.grafana_cloud.receiver]
    }
    {{- end }}
